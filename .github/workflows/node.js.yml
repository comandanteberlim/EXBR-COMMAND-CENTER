
name: EXBR - Verificação do sistema

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação
        run: npx vite build
